  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", sans-serif;
    line-height: 1.85;

  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  #doc h1 { font-size: 40px; margin: 24px 0 8px; text-align: center; }
  #doc h1 + p, #doc h1 + p + p, #doc h1 + p + p + p { text-align: center; margin: 4px 0; }
  #doc h2 { font-size: 22px; margin: 36px 0 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  #doc hr + h2 { border-top: 0; padding-top: 0; margin-top: 0; }
  #doc h3 { font-size: 18px; margin: 28px 0 6px; }
  #doc p { margin: 8px 0; }
  #doc strong { font-weight: 650; }
  #doc em { color: var(--sub); }
  #doc a { color: var(--blue); }
  #doc hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
  #doc ul, #doc ol { padding-left: 1.4em; }
  #doc code { background: #161616; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: .92em; overflow-wrap: anywhere; }
  #doc .table { overflow-x: auto; margin: 12px 0; }
  #doc table { border-collapse: collapse; width: 100%; font-size: 14px; }
  #doc th, #doc td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }

  .src a { color: var(--sub); }
  nav.site { text-align: center; font-size: 13px; color: var(--dim); margin: 24px 0 0; padding: 0 16px; }
  nav.site a { color: var(--sub); text-decoration: none; }
  nav.site a:hover { color: var(--blue); }

<main>
  <div id="doc"><p id="state">基本構想を読み込んでいます…</p></div>
  <p class="src">このページは、リポジトリの <a href="https://github.com/ittekiou/dyxis/blob/main/README.md">README.md</a> をそのまま読み込んで表示しています。</p>
</main>

<footer>
  <nav class="site"><a href="./">入口</a> ・ <a href="guide.html">はじめての方へ</a> ・ <a href="maker.html">巣をつくる</a> ・ <a href="commons.html">地図（Commons）</a> ・ <b>基本構想</b> ・ <a href="NEST-SPEC.html">仕様案</a></nav>
  <p class="credit">この小さなしくみは、2026年11月、一狄翁と Echodemy の AI たち（綴音・響詠・謡理）が置きはじめました。だれのものでもありません。<br>

</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(async () => {
  const SRC = "https://raw.githubusercontent.com/ittekiou/dyxis/main/README.md";
  const box = document.getElementById("doc");
  try {
    const r = await fetch(SRC, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const md = await r.text();
    box.innerHTML = marked.parse(md);
    // リポジトリの中の .md へのリンクは、このサイトのページ（.html）へ。入口へのリンクはそのまま。
    box.querySelectorAll("a[href]").forEach(a => {
      const h = a.getAttribute("href");
      if (/^[^:#]+\.md(#.*)?$/i.test(h)) a.setAttribute("href", h.replace(/README\.md/i, "concept.html").replace(/\.md(#|$)/i, ".html$1"));
    });
    box.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "table"; t.replaceWith(w); w.appendChild(t); });
  } catch (e) {
    box.innerHTML = `<p id="state">読み込めませんでした。<a href="https://github.com/ittekiou/dyxis/blob/main/README.md">GitHub の上で読む</a></p>`;
  }
})();
</script>
</body>
