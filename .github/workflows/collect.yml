name: Collect feeds

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 06:17（日本時間）
    - cron: "47 3 * * *"    # 毎日 12:47（日本時間）
  workflow_dispatch:         # Actions の画面から手で動かすこともできる

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the newest items from each Nest
        run: python3 scripts/collect.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 書き込みのリンクを読めるページへ付け替えるのに使う
      - name: Commit feeds.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.json
          git diff --cached --quiet || git commit -m "Collect feeds"
          git push
